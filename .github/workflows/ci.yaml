name: ci

on:
  push:
  pull_request:

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  # macOS proves the vendored tree-sitter runtime compiles and the R grammar
  # round-trips. Only the CRAN Suggests get installed here -- pulling every
  # grammar package would double the job for no extra portability signal.
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master

      - name: Dependencies
        run: ./run.sh install_deps

      - name: Test
        run: ./run.sh run_tests

  # Ubuntu goes through r2u + rapt instead of r-ci's bspm bootstrap:
  # Python-free, dogfoods cornball's own installer, and the mirror
  # fetch (the part that actually flakes) gets explicit retries.
  ubuntu-rapt:
    # pinned, not -latest: the apt sources below hardcode noble
    runs-on: ubuntu-24.04

    # The site library is root-owned and the grammar packages install as the
    # runner user, so give them a writable lib. Outside the workspace so
    # `R CMD build .` doesn't sweep it into the tarball.
    env:
      R_LIBS_USER: /tmp/Rlib

    steps:
      - uses: actions/checkout@v6

      - run: mkdir -p /tmp/Rlib

      - name: r2u and R
        run: |
          wget -q -O- https://eddelbuettel.github.io/r2u/assets/dirk_eddelbuettel_key.asc \
            | sudo tee /etc/apt/trusted.gpg.d/cranapt_key.asc > /dev/null
          echo "deb [arch=amd64] https://r2u.stat.illinois.edu/ubuntu noble main" \
            | sudo tee /etc/apt/sources.list.d/cranapt.list
          wget -q -O- https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc \
            | sudo tee /etc/apt/trusted.gpg.d/cran_ubuntu_key.asc > /dev/null
          echo "deb https://cloud.r-project.org/bin/linux/ubuntu noble-cran40/" \
            | sudo tee /etc/apt/sources.list.d/cran_r.list
          printf 'Package: *\nPin: release o=CRAN-Apt Project\nPin: release l=CRAN-Apt Packages\nPin-Priority: 700\n' \
            | sudo tee /etc/apt/preferences.d/99cranapt
          ok=0
          for i in 1 2 3 4; do
            if sudo apt-get update -qq; then ok=1; break; fi
            echo "apt update failed, retry $i"; sleep 45
          done
          test "$ok" = 1 || { echo "apt update failed after 4 attempts"; exit 1; }
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-base-dev debhelper

      - name: rapt
        env:
          RAPT_REF: fc71e12d8285c02b55d0408126a1be4338ded1d4
        run: |
          git clone https://github.com/cornball-ai/rapt /tmp/rapt
          git -C /tmp/rapt checkout --quiet "$RAPT_REF"
          cd /tmp/rapt/pkg
          dpkg-buildpackage -us -uc -b
          sudo apt-get install -y /tmp/rapt/rapt_*.deb
          Rscript -e 'print(rapt::manager())'

      # Read from DESCRIPTION rather than a hardcoded list: a
      # hardcoded one drifts the moment a dependency is added, and
      # then fails here as a missing-package error that looks like a
      # CI bug rather than the omission it is.
      - name: Dependencies (install.packages -> rapt -> apt -> r2u)
        run: |
          Rscript -e '
            d <- read.dcf("DESCRIPTION", c("Depends", "Imports", "Suggests"))
            pkgs <- trimws(unlist(strsplit(
              gsub("\\s*\\([^)]*\\)", "", d[!is.na(d)]), ",")))
            pkgs <- setdiff(pkgs, c("R", "", rownames(installed.packages())))
            cat("installing:", paste(pkgs, collapse = ", "), "\n")
            if (length(pkgs)) install.packages(pkgs)
          '

      # The grammar packages are not on CRAN, so they are not in Suggests and
      # every grammar test exit_file()s without them. Pull them from drat so
      # the interop actually runs here instead of silently skipping -- that
      # coverage is the whole point of a runtime package.
      - name: Grammar packages from drat
        run: |
          Rscript -e '
            grammars <- c("treesitter.python", "treesitter.cpp", "treesitter.go",
                          "treesitter.rust", "treesitter.javascript")
            install.packages(grammars, type = "source",
                             repos = "https://cornball-ai.github.io/drat")
            missing <- setdiff(grammars, rownames(installed.packages()))
            if (length(missing)) {
              stop("grammar packages failed to install: ",
                   paste(missing, collapse = ", "))
            }
          '

      - name: Build and check
        run: |
          R CMD build .
          _R_CHECK_FORCE_SUGGESTS_=false R CMD check --no-manual --as-cran bonsaisitter_*.tar.gz

      - name: Test
        run: |
          sudo R CMD INSTALL bonsaisitter_*.tar.gz
          Rscript -e 'tinytest::test_package("bonsaisitter")'

      - name: Portability audit
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e 'install.packages("remotes"); remotes::install_github("cornball-ai/tinyelf", upgrade = "never")'
          Rscript -e 'so <- file.path(system.file("libs", package = "bonsaisitter"), "bonsaisitter.so"); res <- tinyelf::audit_so(so); print(res); if (isTRUE(res[[1]][["pass"]])) invisible() else stop("tinyelf portability audit failed")'
